<main>

<h2>Circle Calculator</h2>

<div class="card-container">

    <!-- Diameter -->
    <div class="card">

        <h3>Diameter</h3>

        <p><b>Formula:</b> Diameter = 2 × Radius</p>

        <input type="number" id="radiusInput" placeholder="Enter Radius">

        <br><br>

        <button onclick="calculateDiameter()">Solve</button>

        <br><br>

        <label>Answer</label>
        <input type="text" id="diameterAnswer" readonly>

    </div>

    <!-- Radius -->
    <div class="card">

        <h3>Radius</h3>

        <p><b>Formula:</b> Radius = Diameter ÷ 2</p>

        <input type="number" id="diameterInput" placeholder="Enter Diameter">

        <br><br>

        <button onclick="calculateRadius()">Solve</button>

        <br><br>

        <label>Answer</label>
        <input type="text" id="radiusAnswer" readonly>

    </div>

    <!-- Circumference -->
    <div class="card">

        <h3>Circumference</h3>

        <p><b>Formula:</b> C = 2πr</p>

        <input type="number" id="circumferenceRadius" placeholder="Enter Radius">

        <br><br>

        <button onclick="calculateCircumference()">Solve</button>

        <br><br>

        <label>Answer</label>
        <input type="text" id="circumferenceAnswer" readonly>

    </div>

</div>
