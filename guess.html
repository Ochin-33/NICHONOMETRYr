<main>

<div class="guess-container">

    <!-- Game -->
    <div class="card guess-game">

        <h2>🎲 Guess the Number</h2>

        <p>I'm thinking of a number from <strong>1 to 100</strong>.</p>

        <input type="number" id="guessInput" placeholder="Enter your guess">

        <br><br>

        <button id="guessBtn" onclick="checkGuess()">Guess</button>

        <button id="restartBtn" onclick="restartGame()" style="display:none;">
            Play Again
        </button>

        <h3 id="message"></h3>

        <p>Attempts: <span id="attempts">0</span></p>

    </div>

    <!-- History -->
    <div class="card history">

        <h2>📜 Guess History</h2>

        <ul id="historyList"></ul>

    </div>

</div>

</main>

<audio id="bgMusic">
    <source src="img/I Knew It I Knew You.mp3" type="audio/mpeg">
</audio>
